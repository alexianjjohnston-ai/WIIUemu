name: Release

# Builds the downloads: one self-contained .exe for Windows (with the official Cemu release built in, so the first
# start needs no internet), a zip with one universal binary for macOS.
# - Pushing a tag like v1.0.0 (must match the version in Cargo.toml and apps/phone/package.json, and have a
#   CHANGELOG section): builds, tests the executables and creates a *draft* GitHub release with notes from
#   CHANGELOG.md and SHA256 checksums. The repository owner reviews and publishes it (docs/releasing.md).
# - Manual run (Actions → Release → Run workflow) or pushing a `test/**` branch: same builds and tests, the
#   files are attached to the workflow run only.
# - Manual run on `main` with "Make the release" ticked: the same as pushing the tag, for when a tag can't be
#   pushed (e.g. from a phone). The release gets the tag `v<version>` on the commit that was built. A
#   pre-release (a version like 0.9.0-beta.1) is published at once; a full version stays a draft for the owner.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Make the release: tag this commit with its version and create the GitHub release (main only)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
    branches: ["test/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A manual run asked to make the release (validated in the version job).
  RELEASE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
  # A release build without the phone app inside is a broken download: make it a build error.
  WIIU_CONNECT_REQUIRE_WEB: "1"

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read and check the version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          phone=$(node -p "require('./apps/phone/package.json').version")
          echo "Cargo: $version, phone app: $phone"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Cargo.toml version '$version' is not a semantic version"; exit 1
          fi
          if [ "$version" != "$phone" ]; then
            echo "::error::Cargo.toml ($version) and apps/phone/package.json ($phone) disagree"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version v$version"; exit 1
            fi
          fi
          if [[ "$GITHUB_REF" == refs/tags/* || "$RELEASE_RUN" == "true" ]]; then
            grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
          fi
          if [[ "$RELEASE_RUN" == "true" ]]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::a release can only be made from main, not $GITHUB_REF"; exit 1
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
              echo "::error::tag v$version already exists: set a new version first (scripts/set-version.sh)"; exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  phone-app:
    name: Build phone app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/phone/package-lock.json
      - name: Build
        working-directory: apps/phone
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: phone-web
          path: apps/phone/dist
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (x64)
    needs: [version, phone-app]
    runs-on: windows-latest
    outputs:
      cemu_tag: ${{ steps.cemu.outputs.tag }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The latest official Cemu release, built into the exe unchanged (crates/wiiu-connect/build.rs), with its
      # MPL-2.0 license. The zip is checked against the SHA-256 digest GitHub records for the release asset.
      - name: Fetch the official Cemu release to include
        id: cemu
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $rel = Invoke-RestMethod -Headers $headers https://api.github.com/repos/cemu-project/Cemu/releases/latest
          $tag = $rel.tag_name
          if ($tag -notmatch '^v[0-9A-Za-z.\-]+$') { throw "unexpected Cemu tag $tag" }
          $asset = $rel.assets | Where-Object { $_.name -like '*-windows-x64.zip' } | Select-Object -First 1
          if (-not $asset) { throw "Cemu $tag has no -windows-x64.zip" }
          if (-not $asset.browser_download_url.StartsWith('https://github.com/cemu-project/Cemu/releases/download/')) { throw 'unexpected download URL' }
          $dir = Join-Path $env:RUNNER_TEMP 'cemu-bundle'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -UseBasicParsing $asset.browser_download_url -OutFile (Join-Path $dir 'cemu.zip')
          $hash = (Get-FileHash (Join-Path $dir 'cemu.zip') -Algorithm SHA256).Hash.ToLower()
          if ($asset.digest) {
            if ($asset.digest -ne "sha256:$hash") { throw "Cemu zip digest mismatch: $($asset.digest) vs sha256:$hash" }
          } else { Write-Warning 'GitHub reports no digest for this asset; size check only' }
          if ((Get-Item (Join-Path $dir 'cemu.zip')).Length -ne $asset.size) { throw 'Cemu zip size mismatch' }
          Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/cemu-project/Cemu/$tag/LICENSE.txt" -OutFile (Join-Path $dir 'LICENSE.txt')
          if ((Get-Content (Join-Path $dir 'LICENSE.txt') -Raw) -notmatch 'Mozilla Public License Version 2\.0') { throw 'Cemu license is not MPL-2.0 any more: review before bundling' }
          [System.IO.File]::WriteAllText((Join-Path $dir 'TAG'), $tag)
          foreach ($f in 'cemu.zip', 'TAG', 'LICENSE.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $f) -PathType Leaf)) { throw "$f was not written to $dir" }
          }
          Get-ChildItem $dir | Format-Table Name, Length | Out-String
          "Including Cemu $tag ($($asset.name), $($asset.size) bytes, sha256 $hash)"
          "WIIU_CONNECT_BUNDLE_CEMU=$dir" >> $env:GITHUB_ENV
          "CEMU_TAG=$tag" >> $env:GITHUB_ENV
          "tag=$tag" >> $env:GITHUB_OUTPUT
      # The phone app is compiled into the executable (crates/wiiu-connect/build.rs).
      - uses: actions/download-artifact@v4
        with:
          name: phone-web
          path: apps/phone/dist
      # .cargo/config.toml links the C runtime statically.
      - name: Build
        shell: pwsh
        run: |
          Get-ChildItem $env:WIIU_CONNECT_BUNDLE_CEMU | Format-Table Name, Length | Out-String
          cargo build --release --locked -p wiiu-connect
      - name: Check that the exe is self-contained
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents target/release/wiiu-connect.exe | Out-String
          $deps
          if ($deps -match '(?i)vcruntime|msvcp|api-ms-win-crt|ucrtbase') { throw 'the exe needs the Visual C++ runtime DLLs' }
      - name: Smoke test (the exe alone in an empty folder)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'lonely'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/wiiu-connect.exe (Join-Path $dir 'WiiUConnect.exe')
          $exe = Join-Path $dir 'WiiUConnect.exe'
          $v = & $exe --version
          if ($v -ne "wiiu-connect $env:VERSION") { throw "unexpected --version output: $v" }
          $data = Join-Path $env:RUNNER_TEMP 'smoke-data'
          $p = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru -ArgumentList '--no-browser','--no-auto-setup','--bind','127.0.0.1:8737','--data-dir',$data
          try {
            Start-Sleep 3
            $page = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8737/?token=smoke-test-token'
            if ($page.Content -notmatch 'id="root"') { throw 'the embedded phone app was not served' }
            $s = Invoke-RestMethod http://localhost:8737/api/setup/status
            if ($s.setup.version -ne $env:VERSION) { throw "setup page reports version $($s.setup.version)" }
            if ($s.setup.bundled_cemu -ne $env:CEMU_TAG) { throw "built-in Cemu is '$($s.setup.bundled_cemu)', expected $env:CEMU_TAG" }
            # HTTPS for phones (self-signed certificate created on first start).
            $code = & curl.exe -sk -o NUL -w '%{http_code}' 'https://127.0.0.1:8738/?token=smoke-test-token'
            if ($code -ne '200') { throw "HTTPS listener answered $code" }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Smoke test (automatic setup installs the built-in Cemu, then updating downloads it)
        if: startsWith(github.ref, 'refs/heads/test/') || startsWith(github.ref, 'refs/tags/v') || env.RELEASE_RUN == 'true'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'wiiu-data'
          # Exactly what a double-click does, minus the browser.
          $p = Start-Process -FilePath target/release/wiiu-connect.exe -PassThru -ArgumentList '--no-browser','--no-https','--bind','127.0.0.1:8737','--data-dir',$data
          try {
            Start-Sleep 3
            for ($i = 0; $i -lt 150; $i++) {
              $s = Invoke-RestMethod http://localhost:8737/api/setup/status
              if (-not ($s.setup.auto | Where-Object { $_.state -in 'pending', 'running' })) { break }
              Start-Sleep 2
            }
            $s.setup.auto | Format-Table -AutoSize | Out-String -Width 200
            foreach ($step in $s.setup.auto) {
              $ok = $step.state -eq 'done' -or ($step.id -eq 'games' -and $step.state -eq 'skipped')
              if (-not $ok) { throw "automatic setup step '$($step.id)' ended as $($step.state): $($step.detail)" }
            }
            $cemuStep = $s.setup.auto | Where-Object { $_.id -eq 'cemu' }
            if ($cemuStep.detail -ne "Installed the included Cemu $env:CEMU_TAG") { throw "Cemu step: $($cemuStep.detail)" }
            # "Update Cemu" still downloads the latest release over the included one, keeping the settings.
            $post = @{ Method = 'Post'; ContentType = 'application/json'; Body = '{}'; Headers = @{ Origin = 'http://localhost:8737' } }
            Invoke-RestMethod @post http://localhost:8737/api/setup/cemu/download | Out-Null
            for ($i = 0; $i -lt 150; $i++) {
              $d = (Invoke-RestMethod http://localhost:8737/api/setup/status).setup.download
              if ($d.state -ne 'running') { break }
              Start-Sleep 2
            }
            if ($d.state -ne 'done') { throw "updating Cemu ended as $($d.state): $($d.error)" }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
          if (-not (Test-Path (Join-Path $data 'Cemu\CEMU-LICENSE.txt'))) { throw 'Cemu license notice missing' }
          foreach ($f in 'Cemu.exe', 'portable\controllerProfiles\controller1.xml', 'portable\controllerProfiles\controller3.xml') {
            if (-not (Test-Path (Join-Path $data "Cemu\$f"))) { throw "missing $f" }
          }
          if ((Get-Content (Join-Path $data 'Cemu\portable\settings.xml') -Raw) -notmatch '<open_pad>true</open_pad>') {
            throw 'the GamePad window setting was not written'
          }
      - name: Name the download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/wiiu-connect.exe "out/WiiUConnect-$env:VERSION-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS (universal)
    needs: [version, phone-app]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@v4
        with:
          name: phone-web
          path: apps/phone/dist
      - run: cargo build --release --locked -p wiiu-connect --target aarch64-apple-darwin
      - run: cargo build --release --locked -p wiiu-connect --target x86_64-apple-darwin
      - name: Universal binary
        run: |
          mkdir -p package
          lipo -create -output package/wiiu-connect \
            target/aarch64-apple-darwin/release/wiiu-connect \
            target/x86_64-apple-darwin/release/wiiu-connect
          # Ad-hoc signature: required for arm64 executables; not a Developer ID (Gatekeeper still warns).
          codesign --force --sign - package/wiiu-connect
          lipo -info package/wiiu-connect
      - name: Smoke test
        run: |
          test "$(package/wiiu-connect --version)" = "wiiu-connect $VERSION"
          package/wiiu-connect --no-browser --no-https --no-auto-setup --bind 127.0.0.1:8737 --data-dir "$RUNNER_TEMP/smoke" &
          pid=$!
          sleep 3
          curl -fsS 'http://127.0.0.1:8737/?token=smoke-test-token' | grep -q 'id="root"'
          kill $pid
      - name: Package
        run: |
          cp README.md TESTING.md THIRD_PARTY_NOTICES.md package/
          mkdir -p out
          ditto -c -k --sequesterRsrc package "out/WiiUConnect-$VERSION-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: out/*
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CEMU_TAG: ${{ needs.windows.outputs.cemu_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: out
      - name: Checksums and release notes
        run: |
          (cd out && sha256sum WiiUConnect-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          sed "s/<cemu-version>/${CEMU_TAG}/g" docs/release-notes-footer.md >> notes.md
          cat notes.md
      # Always created as a draft, so the files are attached before anyone can see it. For a manual release run
      # GitHub creates the tag on the built commit when the release is published.
      - id: draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          name: Wii U Connect ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: out/*
      - name: Publish the pre-release (manual release run only)
        if: env.RELEASE_RUN == 'true' && contains(needs.version.outputs.version, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        # By id: the tag-name lookup doesn't find drafts.
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq '.html_url'
