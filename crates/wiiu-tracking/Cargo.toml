[package]
name = "wiiu-tracking"
description = "Screen-relative pointing from AprilTag observations: marker layout, homography, aim estimation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
wiiu-apriltag-sys = { workspace = true, optional = true }
jpeg-decoder = { version = "0.3", optional = true, default-features = false }
thiserror = { workspace = true, optional = true }

[features]
# PC-side detection: JPEG decoding + the vendored AprilTag C library (see docs/adr/0001).
detector = ["dep:wiiu-apriltag-sys", "dep:jpeg-decoder", "dep:thiserror"]

[lints]
workspace = true

[dev-dependencies]
jpeg-encoder = "0.6"
