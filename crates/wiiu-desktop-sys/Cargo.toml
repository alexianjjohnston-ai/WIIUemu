[package]
name = "wiiu-desktop-sys"
description = "The Win32 calls of Wii U Connect's desktop features (TV border window, Cemu window placement) behind safe functions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Not `[lints] workspace = true`: like wiiu-apriltag-sys, this crate is a place FFI (`unsafe`) is allowed. Clippy
# still applies.
[lints.clippy]
all = { level = "warn", priority = -1 }
