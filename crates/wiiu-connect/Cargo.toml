[package]
name = "wiiu-connect"
description = "Wii U Connect session server: phones in, Cemu DSU out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "wiiu-connect"
path = "src/main.rs"

[dependencies]
wiiu-dsu.workspace = true
wiiu-controller.workspace = true
wiiu-cemu.workspace = true
wiiu-tracking = { workspace = true, features = ["detector"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs", "json"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
thiserror.workspace = true

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
jpeg-encoder = "0.6"

[lints]
workspace = true
